<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>诊断页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b9d;
            text-align: center;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff5a8a;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Vue应用诊断页面</h1>
        
        <div id="status-container">
            <div class="status info">正在检查...</div>
        </div>
        
        <div>
            <button onclick="checkVueApp()">检查Vue应用</button>
            <button onclick="checkAPI()">检查API连接</button>
            <button onclick="checkLocalStorage()">检查本地存储</button>
            <button onclick="clearAll()">清除所有数据</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        function addResult(title, content, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = `<strong>${title}:</strong><br><pre>${content}</pre>`;
            results.appendChild(div);
        }

        function checkVueApp() {
            document.getElementById('results').innerHTML = '';
            
            // 检查Vue是否加载
            if (typeof Vue !== 'undefined') {
                addResult('Vue框架', 'Vue已加载', 'success');
            } else {
                addResult('Vue框架', 'Vue未加载', 'error');
            }
            
            // 检查页面元素
            const app = document.getElementById('app');
            if (app) {
                addResult('App容器', `找到#app元素，内容长度: ${app.innerHTML.length}`, 'success');
                if (app.innerHTML.trim() === '') {
                    addResult('App内容', 'App容器为空', 'error');
                } else {
                    addResult('App内容', '有内容', 'success');
                }
            } else {
                addResult('App容器', '未找到#app元素', 'error');
            }
            
            // 检查控制台错误
            addResult('控制台', '请打开浏览器控制台查看错误信息', 'info');
        }

        function checkAPI() {
            fetch('http://localhost:8080/api/user/profile')
                .then(response => {
                    addResult('API连接', `状态码: ${response.status}`, response.ok ? 'success' : 'error');
                    return response.text();
                })
                .then(data => {
                    addResult('API响应', data.substring(0, 200) + '...', 'info');
                })
                .catch(error => {
                    addResult('API连接', `连接失败: ${error.message}`, 'error');
                });
        }

        function checkLocalStorage() {
            const token = localStorage.getItem('token');
            const userInfo = localStorage.getItem('userInfo');
            
            addResult('Token', token || '无', token ? 'success' : 'info');
            addResult('用户信息', userInfo || '无', userInfo ? 'success' : 'info');
            
            // 显示所有localStorage内容
            const allStorage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                allStorage[key] = localStorage.getItem(key);
            }
            addResult('所有本地存储', JSON.stringify(allStorage, null, 2), 'info');
        }

        function clearAll() {
            localStorage.clear();
            sessionStorage.clear();
            addResult('清除数据', '已清除所有本地存储和会话存储', 'success');
        }

        // 页面加载时自动检查
        window.onload = function() {
            checkVueApp();
        };
    </script>
</body>
</html>
