<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>基础测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ff6b9d;
            text-align: center;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        button {
            background: #ff6b9d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #ff5a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 基础功能测试</h1>
        
        <div class="status">
            <strong>静态HTML测试:</strong> 如果你能看到这个页面，说明服务器正常运行
        </div>
        
        <div class="status">
            <strong>当前时间:</strong> <span id="time"></span>
        </div>
        
        <div class="status">
            <strong>JavaScript测试:</strong> <span id="js-status">检查中...</span>
        </div>
        
        <div>
            <button onclick="testVueApp()">测试Vue应用</button>
            <button onclick="testAPI()">测试API</button>
            <button onclick="window.location.href='/'">返回首页</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        // 更新时间
        function updateTime() {
            document.getElementById('time').textContent = new Date().toLocaleString();
        }
        
        // JavaScript测试
        document.getElementById('js-status').textContent = 'JavaScript正常运行';
        updateTime();
        setInterval(updateTime, 1000);
        
        function testVueApp() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="status">正在检查Vue应用...</div>';
            
            // 检查Vue应用的DOM
            fetch('/')
                .then(response => response.text())
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const appDiv = doc.getElementById('app');
                    
                    if (appDiv) {
                        results.innerHTML += '<div class="status">✅ 找到#app元素</div>';
                    } else {
                        results.innerHTML += '<div class="status">❌ 未找到#app元素</div>';
                    }
                })
                .catch(error => {
                    results.innerHTML += `<div class="status">❌ 检查失败: ${error.message}</div>`;
                });
        }
        
        function testAPI() {
            const results = document.getElementById('results');
            results.innerHTML = '<div class="status">正在测试API连接...</div>';
            
            fetch('http://localhost:8080/api/user/profile')
                .then(response => {
                    if (response.ok) {
                        results.innerHTML += '<div class="status">✅ API服务器连接正常</div>';
                    } else {
                        results.innerHTML += `<div class="status">⚠️ API返回状态码: ${response.status}</div>`;
                    }
                })
                .catch(error => {
                    results.innerHTML += `<div class="status">❌ API连接失败: ${error.message}</div>`;
                });
        }
        
        console.log('基础测试页面加载完成');
    </script>
</body>
</html>
