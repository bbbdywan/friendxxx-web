<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>心灵治愈 - AI对话</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        :root {
            --primary-color: #8FD6E1;
            --secondary-color: #B8E9F5;
            --background: #F8FDFF;
            --card-bg: #FFFFFF;
            --user-bubble: #E6F7FF;
            --ai-bubble: #FFFFFF;
            --text-primary: #3A506B;
            --text-secondary: #5C7A99;
            --shadow: 0 5px 20px rgba(143, 214, 225, 0.15);
        }
        
        body {
            background: var(--background);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            overflow: hidden;
        }
        
        /* 头部样式 */
        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            padding: 20px 16px;
            text-align: center;
            color: white;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
        }
        
        .header h1 {
            font-weight: 500;
            font-size: 1.4rem;
            margin-bottom: 4px;
        }
        
        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            -webkit-overflow-scrolling: touch;
        }
        
        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 22px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
            box-shadow: var(--shadow);
            font-size: 1rem;
        }
        
        .user-message {
            background: var(--user-bubble);
            border-bottom-right-radius: 4px;
            align-self: flex-end;
            color: var(--text-primary);
        }
        
        .ai-message {
            background: var(--card-bg);
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            color: var(--text-primary);
        }
        
        /* 输入区域 */
        .input-container {
            padding: 16px;
            background: var(--card-bg);
            display: flex;
            gap: 12px;
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.03);
        }
        
        .input-box {
            flex: 1;
            position: relative;
        }
        
        .input-box input {
            width: 100%;
            padding: 16px 50px 16px 20px;
            border: none;
            border-radius: 30px;
            outline: none;
            font-size: 1rem;
            background: #F0F9FF;
            color: var(--text-primary);
            box-shadow: 0 4px 12px rgba(143, 214, 225, 0.2);
        }
        
        .input-box input::placeholder {
            color: #9AB3C5;
        }
        
        .input-box .icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 1.3rem;
        }
        
        .send-button {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(143, 214, 225, 0.4);
            transition: all 0.3s ease;
        }
        
        .send-button:active {
            transform: scale(0.95);
        }
        
        /* 打字指示器 */
        .typing-indicator {
            background: var(--card-bg);
            border-radius: 22px;
            padding: 14px 18px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            align-self: flex-start;
            box-shadow: var(--shadow);
        }
        
        .typing-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary-color);
            opacity: 0.6;
            animation: pulse 1.5s infinite;
        }
        
        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        
        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }
        
        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        
        /* 初始欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 30px 20px;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }
        
        .welcome-message .icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <!-- 顶部标题栏 -->
    <div class="header">
        <h1>心灵治愈</h1>
        <p>您的专属AI陪伴伙伴</p>
    </div>
    
    <!-- 聊天消息容器 -->
    <div class="chat-container" id="chat-container">
        <!-- 初始欢迎消息 -->
        <div class="welcome-message">
            <div class="icon">
                <i class="fas fa-dove"></i>
            </div>
            <p>您好！我是您的AI心灵伙伴<br>随时在这里倾听您的心声</p>
        </div>
        
        <!-- 消息会通过JS动态添加 -->
    </div>
    
    <!-- 底部输入区域 -->
    <div class="input-container">
        <div class="input-box">
            <input type="text" id="message-input" placeholder="输入您想说的话...">
            <div class="icon">
                <i class="fas fa-smile"></i>
            </div>
        </div>
        <button class="send-button" id="send-button">
            <i class="fas fa-paper-plane"></i>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');
        
        // 初始欢迎消息
        const welcomeMessages = [
            "您好！我是您的AI心灵伙伴🌸",
            "无论您有什么开心事、烦恼或困惑，都可以和我分享",
            "我会以最温暖的方式陪伴您，给您支持和建议",
            "今天有什么想和我聊聊的吗？"
        ];
        
        // 模拟AI回复
        const aiResponses = [
            "我理解您的感受。有时候，给自己一点时间和空间很重要呢🌿",
            "谢谢您与我分享这些。您觉得是什么让您有这样的感觉呢？",
            "这确实是个值得思考的问题。或许我们可以一起探索可能的解决方案？",
            "您已经做得很好了！面对挑战时，记得要对自己温柔一些💖",
            "我注意到您最近似乎有些疲惫，要不要尝试一个简单的呼吸练习？",
            "每一个小进步都值得庆祝🎉 您已经在成长的路上了！",
            "感受到您的情绪波动是正常的，这些都是宝贵的人生体验",
            "我在这里陪着您，无论您想表达什么都可以安全地分享",
            "有时候，换个角度看待问题会有意想不到的收获呢✨"
        ];
        
        // 初始化：显示欢迎消息
        setTimeout(() => {
            welcomeMessages.forEach((msg, index) => {
                setTimeout(() => {
                    addMessage(msg, 'ai');
                }, 800 * (index + 1));
            });
        }, 500);
        
        // 添加消息到聊天窗口
        function addMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', `${sender}-message`);
            messageElement.textContent = text;
            chatContainer.appendChild(messageElement);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // 显示AI正在输入
        function showTypingIndicator() {
            const typingElement = document.createElement('div');
            typingElement.classList.add('typing-indicator');
            typingElement.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            chatContainer.appendChild(typingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return typingElement;
        }
        
        // 发送消息
        function sendMessage() {
            const message = messageInput.value.trim();
            if (message) {
                // 添加用户消息
                addMessage(message, 'user');
                messageInput.value = '';
                
                // 显示正在输入
                const typingElement = showTypingIndicator();
                
                // 模拟AI回复（随机延迟）
                setTimeout(() => {
                    chatContainer.removeChild(typingElement);
                    const randomResponse = aiResponses[Math.floor(Math.random() * aiResponses.length)];
                    addMessage(randomResponse, 'ai');
                }, 1000 + Math.random() * 1000);
            }
        }
        
        // 事件监听
        sendButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // 输入框获得焦点时自动滚动到底部
        messageInput.addEventListener('focus', () => {
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 300);
        });
    </script>
</body>
</html>
