<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Claude Chat</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --bubble-user: #0f3460;
    --bubble-claude: #1a1a2e;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #e94560;
    --input-bg: #0f3460;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .header {
    background: var(--surface);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .header .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #666;
    flex-shrink: 0;
  }
  .header .dot.online { background: #4ade80; }
  .header .title {
    font-size: 15px;
    font-weight: 600;
    flex: 1;
  }
  .header .status {
    font-size: 11px;
    color: var(--text-dim);
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.55;
    word-break: break-word;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }

  .msg.claude {
    align-self: flex-start;
    background: var(--bubble-claude);
    border: 1px solid rgba(255,255,255,0.06);
    border-bottom-left-radius: 4px;
  }

  .msg.streaming {
    border-left: 2px solid var(--accent);
  }

  .msg .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .msg.error {
    background: rgba(233,69,96,0.15);
    border: 1px solid rgba(233,69,96,0.3);
    color: #fca5a5;
    align-self: center;
    font-size: 12px;
    max-width: 90%;
  }

  /* Input */
  .input-area {
    background: var(--surface);
    padding: 10px 12px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
    display: flex;
    gap: 8px;
    border-top: 1px solid rgba(255,255,255,0.05);
  }

  .input-area input {
    flex: 1;
    background: var(--input-bg);
    border: none;
    border-radius: 20px;
    padding: 10px 16px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .input-area input::placeholder {
    color: var(--text-dim);
  }

  .input-area button {
    width: 40px; height: 40px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 18px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.2s;
  }
  .input-area button:disabled {
    opacity: 0.4;
  }

  .input-area button svg {
    width: 18px; height: 18px;
    fill: none;
    stroke: white;
    stroke-width: 2.5;
  }
</style>
</head>
<body>

<div class="header">
  <div class="dot" id="statusDot"></div>
  <span class="title">Claude</span>
  <span class="status" id="statusText">connecting...</span>
</div>

<div class="messages" id="messages">
  <div class="msg claude">
    <div class="label">Claude</div>
    你好！连接成功后即可开始对话。
  </div>
</div>

<div class="input-area">
  <input type="text" id="input" placeholder="输入消息..." autocomplete="off" />
  <button id="sendBtn" disabled>
    <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
  </button>
</div>

<script>
const WS_URL = window.location.protocol === 'https:'
  ? `wss://${window.location.host}/ws`
  : `ws://${window.location.host}:3001`;

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

let ws = null;
let currentStreamEl = null;

function setStatus(online, text) {
  statusDot.className = 'dot' + (online ? ' online' : '');
  statusText.textContent = text;
  sendBtn.disabled = !online;
}

function connect() {
  ws = new WebSocket(WS_URL);

  ws.onopen = () => {
    ws.send(JSON.stringify({ type: 'auth', role: 'phone' }));
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    switch (msg.type) {
      case 'auth_ok':
        setStatus(true, '已连接');
        break;

      case 'chunk':
        if (!currentStreamEl) {
          currentStreamEl = appendMsg('claude', '', true);
        }
        currentStreamEl.textContent += msg.text;
        messagesEl.scrollTop = messagesEl.scrollHeight;
        break;

      case 'done':
        if (currentStreamEl) {
          currentStreamEl.classList.remove('streaming');
          currentStreamEl = null;
        }
        break;

      case 'error':
        appendMsg('error', msg.text);
        if (currentStreamEl) {
          currentStreamEl.classList.remove('streaming');
          currentStreamEl = null;
        }
        break;

      case 'pong':
        break;
    }
  };

  ws.onclose = () => {
    setStatus(false, '断开，重连中...');
    setTimeout(connect, 3000);
  };

  ws.onerror = () => {
    ws.close();
  };
}

function appendMsg(role, text, streaming) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (streaming) el.classList.add('streaming');

  if (role === 'claude') {
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'Claude';
    el.appendChild(label);
  }

  const content = document.createElement('span');
  content.textContent = text;
  el.appendChild(content);

  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return content;
}

function send() {
  const text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;

  appendMsg('user', text);
  inputEl.value = '';
  ws.send(JSON.stringify({ type: 'message', text }));
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') send();
});

// Keepalive ping every 25s
setInterval(() => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'ping' }));
  }
}, 25000);

connect();
</script>
</body>
</html>
